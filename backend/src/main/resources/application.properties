spring.application.name=Cloud-faro
server.port=8081
spring.datasource.url=jdbc:sqlite:productos_db.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/REPLACE_ME}
cloudfaro.cognito.client-id=${COGNITO_CLIENT_ID:REPLACE_ME}
server.error.include-message=never
